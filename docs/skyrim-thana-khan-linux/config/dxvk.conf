# Linux/Proton DXVK tuning for Thana Khan Modspack v8.4.
# The pack's original Windows file is kept as dxvk.conf.windows-original.
#
# Dropped from the original, and why:
#   dxvk.enablePipelineCache = false          -> forced a full shader recompile every
#                                                session. Disabled on Windows to dodge an
#                                                ENB conflict; on Linux it is the single
#                                                biggest cause of traversal stutter.
#   dxvk.enableGraphicsPipelineLibrary = false-> same story; Auto is much smoother here.
#   dxgi.nvapiHack                            -> Proton manages NVAPI itself; forcing it
#                                                interferes with DLSS.
#   dxvk.enableAsync / enableShaderPrefetch /
#   maxVram / trackMemoryUsage / presentThrottle
#   / useEarlyDiscard / useRawSsbo            -> belong to DXVK-async 1.10 forks, not the
#                                                DXVK 2.x that Proton ships. Silently ignored.

[SkyrimSE.exe]

# Skyrim creates its window before the swapchain; this avoids a startup race.
dxgi.deferSurfaceCreation = True

# Let the compositor pick — works with VRR on the 4K@160Hz DP-1 panel.
dxgi.tearFree = Auto

d3d11.dcSingleUseMode = True
d3d11.relaxedBarriers = True
d3d11.invariantPosition = True

# Conservative dynamic-resource path: fewer random CTDs with a heavy mod list.
d3d11.cachedDynamicResources = c

# 0 = scale to the 16 available cores.
dxvk.numCompilerThreads = 0

dxvk.logLevel = none

