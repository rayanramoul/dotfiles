"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# Minimal left prompt, rest on the right
format = """$directory$character"""
right_format = """$git_branch$git_status$nodejs$rust$golang$python$aws$cmd_duration$time"""

command_timeout = 1000

palette = "noctalia"

[character]
vicmd_symbol = "[N](bold yellow) >>>"
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
substitutions = { "Documents" = "󰈙 ", "Downloads" = " ", "Music" = " ", "Pictures" = " " }

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = "bold mauve"

[git_status]
style = "bold red"

[nodejs]
format = '[$symbol($version)]($style) '
symbol = " "

[rust]
format = '[$symbol($version)]($style) '
symbol = " "

[golang]
format = '[$symbol($version)]($style) '
symbol = " "
style = "bold cyan"

[python]
format = '[$symbol($version)]($style) '
symbol = " "
style = "bold yellow"

[docker_context]
disabled = true

[kubernetes]
disabled = true

[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
disabled = false
style = "bold blue"
symbol = " "

[time]
disabled = false
time_format = "%R"
format = '[ $time]($style) '
style = "bold overlay2"

