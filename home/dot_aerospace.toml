# AeroSpace config — mirrors Hyprland keybinds/layout where macOS allows.
# Hypr uses SUPER as mainMod; macOS reserves cmd for system shortcuts,
# so `alt` is the tiling modifier here. Letter keys match 1:1.

# Sketchybar + JankyBorders integration
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

after-login-command = []

after-startup-command = [
  'exec-and-forget borders active_color=0xff00FFFF inactive_color=0xffa1a1a1 width=5.0',
  'exec-and-forget sketchybar',
]

start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus (both monitor change and window focus change).
# AeroSpace has no true focus-follows-mouse (macOS limitation); this is the
# recommended inverse: cursor warps to the focused window.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# Gaps — match Hypr (gaps_in=5, gaps_out=10)
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

[mode.main.binding]
# --- Core app launches (Hypr: SUPER+Return / SUPER+E) ---
alt-enter = 'exec-and-forget open -a "Ghostty"'
alt-q = 'close'                                                       # Hypr: SUPER+Q killactive
alt-v = 'layout floating tiling'                                      # Hypr: SUPER+V togglefloating
alt-f = 'fullscreen'                                                  # Hypr: SUPER+F
alt-ctrl-f = 'layout floating tiling'                                 # existing alt path

# --- Layout toggles ---
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# --- Focus (Hypr: SUPER+H/J/K/L + arrows) ---
alt-left = 'focus left'
alt-h = 'focus left'
alt-down = 'focus down'
alt-j = 'focus down'
alt-up = 'focus up'
alt-k = 'focus up'
alt-right = 'focus right'
alt-l = 'focus right'

# --- Move window (Hypr: SUPER+SHIFT+H/J/K/L + arrows) ---
alt-shift-left = 'move left'
alt-shift-h = 'move left'
alt-shift-down = 'move down'
alt-shift-j = 'move down'
alt-shift-up = 'move up'
alt-shift-k = 'move up'
alt-shift-right = 'move right'
alt-shift-l = 'move right'

# --- Resize (Hypr: SUPER+CTRL+H/J/K/L + arrows, 20px steps) ---
alt-ctrl-left = 'resize width -50'
alt-ctrl-h = 'resize width -50'
alt-ctrl-right = 'resize width +50'
alt-ctrl-l = 'resize width +50'
alt-ctrl-up = 'resize height -50'
alt-ctrl-k = 'resize height -50'
alt-ctrl-down = 'resize height +50'
alt-ctrl-j = 'resize height +50'
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# --- Workspaces 1-10 (Hypr: SUPER+1..0) ---
alt-1 = 'workspace --auto-back-and-forth 1'
alt-2 = 'workspace --auto-back-and-forth 2'
alt-3 = 'workspace --auto-back-and-forth 3'
alt-4 = 'workspace --auto-back-and-forth 4'
alt-5 = 'workspace --auto-back-and-forth 5'
alt-6 = 'workspace --auto-back-and-forth 6'
alt-7 = 'workspace --auto-back-and-forth 7'
alt-8 = 'workspace --auto-back-and-forth 8'
alt-9 = 'workspace --auto-back-and-forth 9'
alt-0 = 'workspace --auto-back-and-forth 10'

# --- Move node to workspace (Hypr: SUPER+SHIFT+1..0) ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# --- Workspace navigation ---
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- Dotfile workflow (Hypr: SUPER+SHIFT+D / SUPER+SHIFT+A / SUPER+SHIFT+C) ---
alt-shift-d = 'exec-and-forget open -a Ghostty -n --args -e nvim ~/.local/share/chezmoi'
alt-shift-a = 'exec-and-forget sh -lc "chezmoi apply --force --keep-going && aerospace reload-config"'
alt-shift-c = 'exec-and-forget open -a Ghostty -n --args -e nvim ~/Documents/Notes'

# --- Lock screen (Hypr: SUPER+X → hyprlock) ---
alt-x = 'exec-and-forget pmset displaysleepnow'

# --- App launchers (Hypr has SUPER+O etc for app shortcuts) ---
alt-o = 'exec-and-forget open -a /Applications/Obsidian.app'
alt-s = 'exec-and-forget open -a /Applications/Slack.app'

# --- Modes ---
alt-shift-enter = 'mode apps'
alt-shift-space = 'mode service'
ctrl-space = 'mode X'

[mode.X.binding]
# Pass-through mode — all shortcuts go to the focused app.
ctrl-space = 'mode main'
esc = 'mode main'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[mode.apps.binding]
alt-enter = ['exec-and-forget open -a "Ghostty"', 'mode main']
alt-o = ['exec-and-forget open -a /Applications/Obsidian.app', 'mode main']
alt-s = ['exec-and-forget open -a /Applications/Slack.app', 'mode main']
esc = 'mode main'

[workspace-to-monitor-force-assignment]
# Uncomment once you know your monitor names (run: aerospace list-monitors)
# 1 = '^Built-in.*$'
# 2 = '^DELL U.*$'

# ------------------------------------------------------------------
# Window → workspace assignments (aligned with Hypr noctalia names):
#   1 = terminal   2 = browser   3 = code
#   4 = chat       5 = games     6 = vault/misc
# Run `aerospace list-apps` to discover app-ids.
# ------------------------------------------------------------------

# --- ws 1: terminal ---
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

# --- ws 2: browsers ---
[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'  # Arc
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 2'

# Brave PWA (Messenger etc.) — goes to chat, overrides generic Brave rule above
[[on-window-detected]]
if.app-id = 'com.brave.Browser.app.mdpkiolbdkhdjpekfbkbmhigcaggjagi'
run = 'move-node-to-workspace 4'

# --- ws 3: code / editors ---
[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.jetbrains.pycharm'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'  # Cursor
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 3'

# --- ws 4: chat / mail ---
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.facebook.archon'  # Messenger
run = 'move-node-to-workspace 4'

# --- ws 5: games ---
[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam.helper'
run = ['layout tiling', 'move-node-to-workspace 5']

# --- ws 6: vault / misc ---
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'move-node-to-workspace 6'

# --- Floating apps ---
[[on-window-detected]]
if.app-name-regex-substring = 'telegram'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'quicktime'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'
