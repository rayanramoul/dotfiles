# Wallpaper and UI
exec-once = awww-daemon &
exec-once = /home/rayanramoul/.local/share/chezmoi/scripts/executable_wallpaperctl.sh start &
# Start Vicinae launcher server instead of ulauncher
exec-once = vicinae server &
exec-once = qs -c noctalia-shell &
exec-once = hypridle &

# Workspace names
exec-once = hyprctl dispatch renameworkspace 1 "󰆍 terminal" && hyprctl dispatch renameworkspace 2 "󰖟 browser" && hyprctl dispatch renameworkspace 3 "󰨞 code" && hyprctl dispatch renameworkspace 4 "󰭹 chat" && hyprctl dispatch renameworkspace 5 "󰊗 games" && hyprctl dispatch renameworkspace 6 "󰒍 vault"

# System utilities
exec-once = clipboard-sync &
exec-once = systemctl --user start plasma-polkit-agent
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = copyq --start-server
exec-once = gammastep -c ~/.config/gammastep/config.ini
