# Environment variables
env = XCURSOR_SIZE,32
env = QT_QPA_PLATFORMTHEME,qt5ct
env = XDG_MENU_PREFIX,arch-

# NVIDIA (required for NVENC hardware encoding and proper Wayland support)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct


# Input configuration
input {

    follow_mouse = 1
    repeat_delay = 200
    repeat_rate = 50

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
    kb_layout = us
    # kb_variant = intl
    kb_options = caps:escape
}

# XWayland settings
xwayland {
    force_zero_scaling = true
}

# Misc settings
misc {
    force_default_wallpaper = -1
}

# Workspace behavior
binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = yes
}

# Layout settings
dwindle {
    pseudotile = true
    preserve_split = true
}

