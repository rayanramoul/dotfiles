# mise (formerly rtx) — single version manager for runtimes.
# Per-project `mise.toml` or `.tool-versions` overrides these globals.
#
# After install: `mise install` to fetch the listed runtimes,
# then `mise use --global node@lts python@3.13 go@latest` if you want
# to write them into ~/.config/mise/config.toml from CLI instead.

[tools]
node = "lts"
python = "3.13"
go = "latest"

[settings]
experimental = false
verbose = false
yes = false
