# satty annotation tool defaults.
# Invoked from `Super + End` via:
#   grim -g "$(slurp)" - | satty --filename - --copy-command wl-copy --early-exit
#
# satty 0.20+ does NOT support font or color-palette config fields — the system
# font is used and the toolbar exposes the colour picker directly. Keep this
# file restricted to schema-valid options or satty refuses to parse it and exits
# without showing a window.

[general]
early-exit = true
fullscreen = false
copy-command = "wl-copy"
initial-tool = "brush"
default-hide-toolbars = false
disable-notifications = false
