# GPU + hardware decode (NVIDIA on this box, but auto-safe handles others)
vo=gpu-next
hwdec=auto-safe
gpu-context=wayland
gpu-api=opengl

# Quality
profile=high-quality
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# Subtitles
sub-auto=fuzzy
sub-font-size=42
slang=en,eng
alang=ja,jpn,en,eng

# OSC (on-screen controller)
osc=yes
osd-font-size=28
osd-bar=yes

# Behavior
keep-open=yes
save-position-on-quit=yes
screenshot-format=png
screenshot-directory=~/Pictures/mpv

# yt-dlp integration
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
